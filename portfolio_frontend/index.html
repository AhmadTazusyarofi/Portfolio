    <!--
      Google Fonts dimuat tanpa menahan render. <link rel="stylesheet"> biasa
      memblokir paint pertama sampai CSS-nya tiba dari server pihak ketiga.
      Trik media="print" membuat browser mengunduhnya dengan prioritas rendah
      dan baru menerapkannya setelah selesai; <noscript> menjaga font tetap
      termuat kalau JavaScript dimatikan.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Archivo+Black&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Archivo+Black&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Archivo+Black&display=swap"
      />
    </noscript>
  </head>

  </body>
